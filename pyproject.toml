[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-logger"
version = "0.1.0"
description = "Middleware library for transparent logging and cost tracking of LLM API calls"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Vaibhav Deshmukh", email = "vdeshmukh203@gmail.com"}]
requires-python = ">=3.8"
keywords = ["llm", "logging", "openai", "anthropic", "middleware", "cost", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
gui = ["flask>=2.0"]

[project.scripts]
llm-api-logger = "llm_api_logger:main"
llm-api-logger-gui = "gui:main"

[tool.setuptools]
py-modules = ["llm_api_logger", "gui"]
